name: Nightly AI Compliance Scan

# Runs the AIBOM-Guard pipeline overnight, uploads the compliance package as an
# artifact, and opens a GitHub issue if a HIGH/PROHIBITED tier is detected.
#
# This is the "everything is automated until you wake up" loop. It is intentionally
# READ-ONLY with respect to your code: it generates compliance artifacts and (at most)
# opens an issue. It never pushes commits or opens PRs on its own.

on:
  schedule:
    - cron: "0 2 * * *"        # 02:00 UTC daily
  workflow_dispatch:            # allow manual runs
    inputs:
      target:
        description: "Path to scan"
        default: "."
      use_case:
        description: "One-line description of what the system does"
        default: ""
      system_name:
        description: "System name for the report"
        default: "this-repository"

permissions:
  contents: read
  issues: write                 # only to file a findings issue

jobs:
  compliance-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v4

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5
        with:
          python-version: "3.12"

      - name: Install AIBOM-Guard
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Run compliance scan
        id: scan
        run: |
          aibom-guard all "${{ github.event.inputs.target || '.' }}" \
            --name "${{ github.event.inputs.system_name || github.repository }}" \
            --use-case "${{ github.event.inputs.use_case }}" \
            -o reports/ || true
          TIER=$(python -c "import json;print(json.load(open('reports/classification.json'))['tier'])")
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "### AI Compliance Scan — tier: \`$TIER\`" >> "$GITHUB_STEP_SUMMARY"
          cat reports/compliance_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compliance package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: ai-compliance-package
          path: reports/
          retention-days: 90

      - name: Open issue on high-risk finding
        if: steps.scan.outputs.tier == 'high' || steps.scan.outputs.tier == 'prohibited'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71  # v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('reports/compliance_report.md', 'utf8');
            const tier = '${{ steps.scan.outputs.tier }}';
            const title = `⚠️ AI compliance: ${tier.toUpperCase()} risk detected (${new Date().toISOString().slice(0,10)})`;
            // Avoid duplicate issues for the same day/tier
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ai-compliance'
            });
            const body = `The nightly AIBOM-Guard scan flagged **${tier}** risk.\n\n` +
                         `_Triage aid — confirm with a human/legal before acting._\n\n` +
                         report.slice(0, 60000);
            if (existing.find(i => i.title === title)) {
              core.info('Issue already exists for today.');
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ai-compliance', tier]
              });
            }
