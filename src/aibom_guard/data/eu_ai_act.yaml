# EU AI Act risk-tier classification knowledge base — Regulation (EU) 2024/1689.
#
# Tiers:
#   prohibited  - Article 5 banned practices
#   high        - Annex III high-risk systems (Articles 6-15 obligations)
#   limited     - Article 50 transparency obligations (chatbots, deepfakes, emotion/biometric disclosure)
#   minimal     - No specific obligations beyond voluntary codes
#
# IMPORTANT: This is a *triage aid*, not a legal determination. Anything matching
# high or prohibited MUST be confirmed by a human. When no category matches with
# confidence, the classifier returns "unclear" so the system surfaces it for review.

prohibited:
  description: "Article 5 — AI practices banned in the EU (from 2 February 2025)."
  categories:
    - id: P1-social-scoring
      name: "Social scoring by public authorities"
      keywords:
        - "social score"
        - "social scoring"
        - "citizen score"
        - "trustworthiness score"
        - "social credit"
        - "social credit system"
        - "government scoring"
        - "public authority scoring"

    - id: P2-manipulative
      name: "Subliminal / manipulative techniques causing harm"
      keywords:
        - "subliminal"
        - "dark pattern"
        - "manipulat"
        - "subconscious manipulation"
        - "psychographic targeting harm"
        - "bypass rational agency"
        - "cognitive bias exploit"
        - "subconscious influence"

    - id: P3-exploit-vulnerable
      name: "Exploiting vulnerabilities of specific groups"
      keywords:
        - "exploit vulnerab"
        - "target children"
        - "target elderly"
        - "exploit disability"
        - "exploit mental illness"
        - "exploit socioeconomic"
        - "target at-risk individuals"

    - id: P4-realtime-biometric-public
      name: "Real-time remote biometric identification in public spaces (law enforcement)"
      keywords:
        - "real-time biometric"
        - "live facial recognition"
        - "public surveillance facial"
        - "real-time facial recognition"
        - "live biometric identification"
        - "cctv facial recognition"
        - "crowd surveillance biometric"
        - "real time face recognition public"
        - "mass surveillance"

    - id: P5-emotion-workplace-edu
      name: "Emotion recognition in workplace / education institutions"
      keywords:
        - "emotion recognition workplace"
        - "emotion detection classroom"
        - "student emotion monitoring"
        - "employee emotion analysis"
        - "workplace emotion ai"
        - "affect recognition employee"
        - "facial expression workplace"
        - "mood monitoring employees"
        - "student engagement monitoring ai"

    - id: P6-predictive-policing-profiling
      name: "Predictive policing based solely on profiling"
      keywords:
        - "predictive policing"
        - "crime prediction profiling"
        - "preemptive arrest"
        - "crime likelihood profiling"
        - "pre-crime prediction"
        - "policing profiling ai"

    - id: P7-biometric-categorisation-sensitive
      name: "Biometric categorisation inferring sensitive attributes"
      keywords:
        - "infer ethnicity"
