# File extensions that indicate a serialized model artifact lives in the repo.
model_file_extensions:
  - {ext: ".pt",          type: "PyTorch weights"}
  - {ext: ".pth",         type: "PyTorch weights"}
  - {ext: ".safetensors", type: "SafeTensors weights (preferred format)"}
  - {ext: ".onnx",        type: "ONNX model"}
  - {ext: ".gguf",        type: "GGUF quantized model (llama.cpp)"}
  - {ext: ".ggml",        type: "GGML quantized model (legacy)"}
  - {ext: ".h5",          type: "Keras/HDF5 model"}
  - {ext: ".keras",       type: "Keras model format"}
  - {ext: ".pb",          type: "TensorFlow SavedModel protobuf"}
  - {ext: ".tflite",      type: "TensorFlow Lite model"}
  - {ext: ".pkl",         type: "Pickled model (review: arbitrary-code risk)"}
  - {ext: ".joblib",      type: "scikit-learn / joblib model"}
  - {ext: ".bin",         type: "Binary weights (verify: many formats use this)"}
  - {ext: ".mar",         type: "TorchServe model archive"}
  - {ext: ".mlmodel",     type: "Apple CoreML model"}
  - {ext: ".pmml",        type: "PMML model interchange format"}
  - {ext: ".cbm",         type: "CatBoost model"}
  - {ext: ".xgb",         type: "XGBoost model"}
  - {ext: ".model",       type: "Generic model file (verify format)"}
  - {ext: ".weights",     type: "Model weights (Darknet/YOLO)"}
  - {ext: ".ckpt",        type: "Checkpoint file (TF / PyTorch Lightning)"}
